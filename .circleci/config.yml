version: 2.1

############################################################################

references:
  # ---------------------------------------------------------------------------
  # checkout: git checkout + npm install + grunt build (needs Node)
  # ---------------------------------------------------------------------------
  checkout_job_steps: &checkout_job_steps
    steps:
      - checkout

      - run:
          name: Checking out dependencies
          command: |
            git clone -b develop --single-branch https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
            git clone -b master --single-branch https://$GITHUB_ACCESS_TOKEN@github.com/Zimbra/zm-nexus.git ~/zm-nexus

      - run:
          name: Install Node.js 18
          command: |
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo bash -
            sudo apt-get install -y nodejs

      - run:
          name: npm install + grunt build
          command: |
            npm install
            PRODUCT_VERSION=0.0.0 BUILD_NUMBER=0 \
              PUBLISHER_NAME="Ascensio System SIA" \
              PUBLISHER_URL="https://www.onlyoffice.com/" \
              npx grunt --no-color -v
          no_output_timeout: 30m

      - persist_to_workspace:
          root: ..
          paths:
            - zm-onlyoffice
            - zm-pkg-tool
            - zm-nexus

  # ---------------------------------------------------------------------------
  # Makefile sees Gruntfile.js.out exists → skips grunt → runs packaging targets.
  # ---------------------------------------------------------------------------
  build_job_steps: &build_job_steps
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Creating build
          command: |
            touch Gruntfile.js.out

            COMMON_DEFINES="build/server/Common/sources/commondefines.js"
            LICENSE_JS="build/server/Common/sources/license.js"

            if [ -f "${COMMON_DEFINES}" ]; then
              sed -i "s|\(const buildVersion = \).*|\1'0.0.0';|" "${COMMON_DEFINES}"
              sed -i "s|\(const buildNumber = \).*|\10;|" "${COMMON_DEFINES}"
            fi
            if [ -f "${LICENSE_JS}" ]; then
              sed -i "s|\(const buildDate = \).*|\1'$(date +%F)';|" "${LICENSE_JS}"
            fi

            STAGE_DIR="build/stage/zimbra-onlyoffice/opt/zimbra/onlyoffice"
            mkdir -p "${STAGE_DIR}"
            # Copy build/server/ but exclude node_modules — they contain
            rsync -a --exclude='node_modules' build/server/. "${STAGE_DIR}/"

            ../zm-pkg-tool/pkg-build.pl \
              --out-type=binary \
              --out-base-dir=build \
              --pkg-version=0.0.0 \
              --pkg-release=1 \
              --pkg-name=zimbra-onlyoffice \
              --pkg-summary="Zimbra OnlyOffice Document Server" \
              --pkg-installs="/opt/zimbra/onlyoffice" \
              --cfg-dir=pkg-spec
          no_output_timeout: 30m

      - store_artifacts:
          path: build/dist

      - persist_to_workspace:
          root: ..
          paths: zm-onlyoffice/build/dist/*

  # ---------------------------------------------------------------------------
  # develop build steps — deb platforms (Ubuntu).
  # Version: <MAJOR>.<MINOR>.<MICRO>.<git_commit_timestamp>
  # Release: 1
  # Base version components come from BUILD_RELEASE_NO (build-info context).
  # ---------------------------------------------------------------------------
  build_develop_deb: &build_develop_deb
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Creating develop package (deb)
          command: |
            # Strip trailing underscore and _GA suffix from BUILD_RELEASE_NO
            BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NO%_}"
            BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NUMBER%_GA}"
            MAJOR_VERSION=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f1)
            MINOR_VERSION=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f2)
            MICRO_TAG=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f3)

            # Unix timestamp of the latest git commit
            GIT_COMMIT_TS=$(git log -1 --format="%ct")

            PKG_VERSION="${MAJOR_VERSION}.${MINOR_VERSION}.${MICRO_TAG}.${GIT_COMMIT_TS}"
            PKG_RELEASE="1"

            echo "PKG_VERSION=${PKG_VERSION}  PKG_RELEASE=${PKG_RELEASE}"

            touch Gruntfile.js.out

            COMMON_DEFINES="build/server/Common/sources/commondefines.js"
            LICENSE_JS="build/server/Common/sources/license.js"

            if [ -f "${COMMON_DEFINES}" ]; then
              sed -i "s|\(const buildVersion = \).*|\1'${PKG_VERSION}';|" "${COMMON_DEFINES}"
              sed -i "s|\(const buildNumber = \).*|\1${CIRCLE_BUILD_NUM};|" "${COMMON_DEFINES}"
            fi
            if [ -f "${LICENSE_JS}" ]; then
              sed -i "s|\(const buildDate = \).*|\1'$(date +%F)';|" "${LICENSE_JS}"
            fi

            STAGE_DIR="build/stage/zimbra-onlyoffice/opt/zimbra/onlyoffice"
            mkdir -p "${STAGE_DIR}"
            # Copy build/server/ but exclude node_modules — they contain
            rsync -a --exclude='node_modules' build/server/. "${STAGE_DIR}/"

            ../zm-pkg-tool/pkg-build.pl \
              --out-type=binary \
              --out-base-dir=build \
              --pkg-version="${PKG_VERSION}" \
              --pkg-release="${PKG_RELEASE}" \
              --pkg-name=zimbra-onlyoffice \
              --pkg-summary="Zimbra OnlyOffice Document Server" \
              --pkg-installs="/opt/zimbra/onlyoffice" \
              --cfg-dir=pkg-spec
          no_output_timeout: 30m

      - store_artifacts:
          path: build/dist

      - persist_to_workspace:
          root: ..
          paths: zm-onlyoffice/build/dist/*

  # ---------------------------------------------------------------------------
  # develop build steps — rpm platforms (CentOS/RHEL).
  # Same versioning as deb: <MAJOR>.<MINOR>.<MICRO>.<git_commit_timestamp>-1
  # ---------------------------------------------------------------------------
  build_develop_rpm: &build_develop_rpm
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Creating develop package (rpm)
          command: |
            # Strip trailing underscore and _GA suffix from BUILD_RELEASE_NO
            BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NO%_}"
            BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NUMBER%_GA}"
            MAJOR_VERSION=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f1)
            MINOR_VERSION=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f2)
            MICRO_TAG=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f3)

            # 4th component = Unix timestamp of the latest git commit
            GIT_COMMIT_TS=$(git log -1 --format="%ct")

            PKG_VERSION="${MAJOR_VERSION}.${MINOR_VERSION}.${MICRO_TAG}.${GIT_COMMIT_TS}"
            PKG_RELEASE="1"

            echo "PKG_VERSION=${PKG_VERSION}  PKG_RELEASE=${PKG_RELEASE}"

            touch Gruntfile.js.out

            COMMON_DEFINES="build/server/Common/sources/commondefines.js"
            LICENSE_JS="build/server/Common/sources/license.js"

            if [ -f "${COMMON_DEFINES}" ]; then
              sed -i "s|\(const buildVersion = \).*|\1'${PKG_VERSION}';|" "${COMMON_DEFINES}"
              sed -i "s|\(const buildNumber = \).*|\1${CIRCLE_BUILD_NUM};|" "${COMMON_DEFINES}"
            fi
            if [ -f "${LICENSE_JS}" ]; then
              sed -i "s|\(const buildDate = \).*|\1'$(date +%F)';|" "${LICENSE_JS}"
            fi

            STAGE_DIR="build/stage/zimbra-onlyoffice/opt/zimbra/onlyoffice"
            mkdir -p "${STAGE_DIR}"
            # Copy build/server/ but exclude node_modules — they contain
            # cross-arch native .node binaries that dh_strip/objcopy can't
            # process on the build host, causing "Unable to recognise format" errors.
            rsync -a --exclude='node_modules' build/server/. "${STAGE_DIR}/"

            ../zm-pkg-tool/pkg-build.pl \
              --out-type=binary \
              --out-base-dir=build \
              --pkg-version="${PKG_VERSION}" \
              --pkg-release="${PKG_RELEASE}" \
              --pkg-name=zimbra-onlyoffice \
              --pkg-summary="Zimbra OnlyOffice Document Server" \
              --pkg-installs="/opt/zimbra/onlyoffice" \
              --cfg-dir=pkg-spec
          no_output_timeout: 30m

      - store_artifacts:
          path: build/dist

      - persist_to_workspace:
          root: ..
          paths: zm-onlyoffice/build/dist/*

  # ---------------------------------------------------------------------------
  # OCI upload (non-master workflow, approval-gated)
  # ---------------------------------------------------------------------------
  deploy_s3_job_steps: &deploy_s3_job_steps
    docker:
      - image: 'cimg/python:3.10'
    resource_class: small
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Create a zip file for artifacts and upload them to the OCI bucket
          command: |
            cd build/dist/
            zip -r $CIRCLE_PROJECT_REPONAME.zip .
            ZIP_FILE_PATH="$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BRANCH-$CIRCLE_BUILD_NUM/archives/$CIRCLE_PROJECT_REPONAME.zip"
            curl -X PUT "$OCI_PAR_URL$ZIP_FILE_PATH" -T $CIRCLE_PROJECT_REPONAME.zip
            echo "artifacts uploaded to $ZIP_FILE_PATH"

  # ---------------------------------------------------------------------------
  # Nexus publish (master_branch-workflow only)
  # ---------------------------------------------------------------------------
  publish_packages_job_steps: &publish_packages_job_steps
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Publish package artifacts to Nexus
          command: |
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl
            bash ../zm-nexus/scripts/publish-packages-to-nexus.sh "build/dist"

############################################################################

jobs:
  checkout:
    working_directory: ~/zm-onlyoffice
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *checkout_job_steps

  # ── non-develop build jobs (used by main workflow, approval-gated) ──────────

  build_u24:
    working_directory: ~/zm-onlyoffice
    shell: /bin/bash -eo pipefail
    docker:
