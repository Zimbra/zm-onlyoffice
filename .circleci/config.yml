############################################################################

workflows:
  version: 2

  # ---------------------------------------------------------------------------
  # master_branch-workflow: auto-triggers on every push/merge to master branch.
  # checkout → parallel OS builds → publish_packages to Nexus, No approvals.
  # ---------------------------------------------------------------------------
  develop-workflow:
    jobs:
      - checkout:
          context:
            - docker-dev-registry
          filters:
            branches:
              only: poc2

      - develop_u24:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - build-info
          filters:
            branches:
              only: poc2

      - develop_u22:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - build-info
          filters:
            branches:
              only: poc2

      - develop_u20:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - build-info
          filters:
            branches:
              only: poc2

      - develop_u18:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - build-info
          filters:
            branches:
              only: poc2

      - develop_c9:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - build-info
          filters:
            branches:
              only: poc2

      - develop_c8:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - build-info
          filters:
            branches:
              only: poc2

      - develop_c7:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - build-info
          filters:
            branches:
              only: poc2

      - publish_packages:
          requires:
            - develop_u24
            - develop_u22
            - develop_u20
            - develop_u18
            - develop_c9
            - develop_c8
            - develop_c7
          context:
            - docker-dev-registry
            - nexus-dev-artifactory
          filters:
            branches:
              only: poc2

  # ---------------------------------------------------------------------------
  # main workflow: all non-master branches. Approval-gated build + OCI upload.
  # ---------------------------------------------------------------------------
  main:
    jobs:
      - build:
          type: approval
          filters:
            branches:
              ignore: poc2

      - checkout:
          requires:
            - build
          context:
            - docker-dev-registry
          filters:
            branches:
              ignore: poc2

      - build_u24:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - oracle
          filters:
            branches:
              ignore: poc2

      - build_u22:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - oracle
          filters:
            branches:
              ignore: poc2

      - build_u20:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - oracle
          filters:
            branches:
              ignore: poc2

      - build_u18:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - oracle
          filters:
            branches:
              ignore: poc2

      - build_c9:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - oracle
          filters:
            branches:
              ignore: poc2

      - build_c8:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - oracle
          filters:
            branches:
              ignore: poc2

      - build_c7:
          requires:
            - checkout
          context:
            - docker-dev-registry
            - oracle
          filters:
            branches:
              ignore: poc2

      - deploy_s3_hold:
          type: approval
          requires:
            - build_u24
            - build_u22
            - build_u20
            - build_u18
            - build_c9
            - build_c8
            - build_c7
          filters:
            branches:
              ignore: poc2

      - deploy_s3:
          context:
            - oracle
          requires:
            - deploy_s3_hold
          filters:
            branches:
              ignore: poc2
