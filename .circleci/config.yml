version: 2.1

############################################################################
parameters:
  compile_tarball:
    type: boolean
    default: false
    description: "Trigger on-demand 6-8 hour OnlyOffice source compilation. Default is false."

  override_version_tag:
    type: string
    default: ""
    description: "Optional: Override version tag in release.env when compiling from source"

############################################################################
references:
  when_develop_workflow: &when_develop_workflow
    and:
      - not: << pipeline.parameters.compile_tarball >>
      - equal: [ << pipeline.git.branch >>, "cicd-draft" ]
      - not:
          equal: [ api, << pipeline.trigger_source >> ]

  when_non_develop_workflow: &when_non_develop_workflow
    and:
      - not: << pipeline.parameters.compile_tarball >>
      - or:
          - equal: [ api, << pipeline.trigger_source >> ]
          - not:
              equal: [ << pipeline.git.branch >>, "cicd-draft" ]

  checkout_job_steps: &checkout_job_steps
    steps:
      - checkout
      - run:
          name: Validate Tarball Availability and Checkout Dependencies
          command: |
            if [ ! -f "release.env" ]; then
              echo "ERROR: release.env file missing from repository root!"
              exit 1
            fi
            source release.env

            echo "=== Validating OnlyOffice Tarball URL from release.env ==="
            echo "Version: ${ONLYOFFICE_VERSION}"
            echo "URL:     ${ONLYOFFICE_TAR_URL}"

            # Fail-fast check: ensure tarball exists before spending runner minutes
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I "${ONLYOFFICE_TAR_URL}" || true)
            if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "302" ]; then
              echo "======================================================================"
              echo "ERROR: Tarball not reachable at ${ONLYOFFICE_TAR_URL} (HTTP ${HTTP_STATUS})"
              echo "Please run the on-demand 'compile_onlyoffice_tarball' workflow first!"
              echo "======================================================================"
              exit 1
            fi
            echo "Tarball verified successfully (HTTP ${HTTP_STATUS})."

            git clone -b develop --single-branch https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
            git clone -b master --single-branch https://${GITHUB_ACCESS_TOKEN}:@github.com/Zimbra/zm-nexus.git ~/zm-nexus
            chmod +x ~/zm-pkg-tool/pkg-build.pl
            echo "BUILD_NO=$CIRCLE_BUILD_NUM" > config.build
      - persist_to_workspace:
          root: ..
          paths:
            - zm-onlyoffice
            - zm-pkg-tool
            - zm-nexus

  # --- Develop Packaging Steps (Ubuntu develop-snapshot) ---
  build_and_isolate_ubuntu: &build_and_isolate_ubuntu
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Creating Packages (Ubuntu develop-snapshot)
          command: |
            source release.env
            cp Makefile.build Makefile.build.orig
            sed -i 's|--pkg-release=1 |--pkg-release=1~develop-snapshot |' Makefile.build
            echo "=== Modified Makefile.build for Ubuntu develop-snapshot ==="
            grep pkg-release Makefile.build

            make -f Makefile.build ONLY_OFFICE_URL="${ONLYOFFICE_TAR_URL}"

            mv Makefile.build.orig Makefile.build
          no_output_timeout: 30m
      - run:
          name: Isolate artifacts into platform-specific directory
          command: |
            echo "Using PLATFORM_TAG=${PLATFORM_TAG}"
            mkdir -p build/dist_workspace/${PLATFORM_TAG}
            find build/dist/ -type f -name "*.deb" -exec mv {} build/dist_workspace/${PLATFORM_TAG}/ \;
            ls -la build/dist_workspace/${PLATFORM_TAG}/
      - store_artifacts:
          path: build/dist_workspace
      - persist_to_workspace:
          root: ..
          paths:
            - zm-onlyoffice/build/dist_workspace

  # --- Develop Packaging Steps (CentOS/Rocky develop-snapshot) ---
  build_and_isolate_c8c9: &build_and_isolate_c8c9
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Creating Packages (CentOS/Rocky develop-snapshot)
          command: |
            source release.env
            cp Makefile.build Makefile.build.orig
            sed -i 's|--pkg-release=1 |--pkg-release=1_develop_snapshot |' Makefile.build
            echo "=== Modified Makefile.build for CentOS/Rocky develop-snapshot ==="
            grep pkg-release Makefile.build

            make -f Makefile.build ONLY_OFFICE_URL="${ONLYOFFICE_TAR_URL}"

            mv Makefile.build.orig Makefile.build
          no_output_timeout: 30m
      - run:
          name: Isolate artifacts into platform-specific directory
          command: |
            echo "Using PLATFORM_TAG=${PLATFORM_TAG}"
            mkdir -p build/dist_workspace/${PLATFORM_TAG}
            find build/dist/ -type f -name "*.x86_64.rpm" -exec mv {} build/dist_workspace/${PLATFORM_TAG}/ \;
            ls -la build/dist_workspace/${PLATFORM_TAG}/
      - store_artifacts:
          path: build/dist_workspace
      - persist_to_workspace:
          root: ..
          paths:
            - zm-onlyoffice/build/dist_workspace

  # --- Non-Develop Packaging Steps (Standard release) ---
  build_creation_steps_non_develop: &build_creation_steps_non_develop
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Creating Packages (Standard release)
          command: |
            source release.env
            make -f Makefile.build ONLY_OFFICE_URL="${ONLYOFFICE_TAR_URL}"
          no_output_timeout: 30m
      - run:
          name: Isolate artifacts into platform-specific directory
          command: |
            echo "Using PLATFORM_TAG=${PLATFORM_TAG}"
            mkdir -p build/dist_workspace/${PLATFORM_TAG}
            find build/dist/ -type f \( -name "*.deb" -o -name "*.x86_64.rpm" \) -exec mv {} build/dist_workspace/${PLATFORM_TAG}/ \;
            ls -la build/dist_workspace/${PLATFORM_TAG}/
      - store_artifacts:
          path: build/dist_workspace
      - persist_to_workspace:
          root: ..
          paths:
            - zm-onlyoffice/build/dist_workspace

  # --- Nexus Publish Steps ---
  publish_packages_job_steps: &publish_packages_job_steps
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Publish package artifacts to Nexus
          command: |
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl
            mkdir -p build/dist_flat
            while IFS= read -r f; do
              tag="$(basename "$(dirname "$f")")"
              mkdir -p "build/dist_flat/${tag}"
              cp "$f" "build/dist_flat/${tag}/"
            done < <(find build/dist_workspace/ -type f \( -name "*.deb" -o -name "*.x86_64.rpm" \))

            echo "=== Flat dist ready for Nexus upload ==="
            find build/dist_flat -type f | sort

            bash ../zm-nexus/scripts/publish-packages-to-nexus.sh "build/dist_flat"

  # --- S3 / OCI Bucket Upload Steps ---
  upload_s3_job_steps: &upload_s3_job_steps
    docker:
      - image: 'cimg/python:3.10'
    resource_class: small
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Create a zip file for artifacts and upload them to the OCI bucket
          command: |
            zip -r $CIRCLE_PROJECT_REPONAME.zip build/dist_workspace
            ZIP_FILE_PATH="$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BRANCH-$CIRCLE_BUILD_NUM/archives/$CIRCLE_PROJECT_REPONAME.zip"
            curl -X PUT "$OCI_PAR_URL$ZIP_FILE_PATH" -T $CIRCLE_PROJECT_REPONAME.zip
            echo "artifacts uploaded to $ZIP_FILE_PATH"

############################################################################
jobs:
  # ========================================================================
  # ON-DEMAND ONLY JOB: 6-8 Hour Source Compilation to Produce .tar.gz
  # ========================================================================
  compile_onlyoffice_tarball:
    working_directory: ~/zm-onlyoffice
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Build OnlyOffice Tarball From Source
          no_output_timeout: 10h
          command: |
            chmod +x scripts/build_onlyoffice_tarball.sh
            OVERRIDE="<< pipeline.parameters.override_version_tag >>"
            bash scripts/build_onlyoffice_tarball.sh "${OVERRIDE}" "u14" "linux_64"
      - store_artifacts:
          path: build/dist_tarball

  # ========================================================================
  # REGULAR PACKAGING JOBS (10-15 mins)
  # ========================================================================
  checkout:
    working_directory: ~/zm-onlyoffice
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *checkout_job_steps

  # Develop Packaging Jobs
  build_u24:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-24.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u24
    <<: *build_and_isolate_ubuntu

  build_u22:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u22
    <<: *build_and_isolate_ubuntu

  build_u20:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-20.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u20
    <<: *build_and_isolate_ubuntu

  build_c9:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-9
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c9
    <<: *build_and_isolate_c8c9

  build_c8:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-8
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c8
    <<: *build_and_isolate_c8c9

  publish_packages:
    working_directory: ~/zm-onlyoffice
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *publish_packages_job_steps

  # Non-Develop Packaging Jobs
  build_u24_non_develop:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-24.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u24
    <<: *build_creation_steps_non_develop

  build_u22_non_develop:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u22
    <<: *build_creation_steps_non_develop

  build_u20_non_develop:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-20.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: u20
    <<: *build_creation_steps_non_develop

  build_c9_non_develop:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-9
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c9
    <<: *build_creation_steps_non_develop

  build_c8_non_develop:
    working_directory: ~/zm-onlyoffice
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-8
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    environment:
      PLATFORM_TAG: c8
    <<: *build_creation_steps_non_develop

  upload_to_s3:
    working_directory: ~/zm-onlyoffice
    <<: *upload_s3_job_steps

############################################################################
workflows:
  version: 2

  # ------------------------------------------------------------------------
  # ON-DEMAND COMPILATION WORKFLOW (Invisible during regular PRs/pushes)
  # ------------------------------------------------------------------------
  tarball-compilation-workflow:
    when: << pipeline.parameters.compile_tarball >>
    jobs:
      - hold_compilation_start:
          type: approval
      - compile_onlyoffice_tarball:
          requires:
            - hold_compilation_start
          context:
            - docker-dev-registry
            - oracle

  # ------------------------------------------------------------------------
  # REGULAR DEVELOP WORKFLOW (10-15 min fast packaging)
  # ------------------------------------------------------------------------
  develop-workflow:
    when: *when_develop_workflow
    jobs:
      - checkout:
          context:
            - docker-dev-registry
            - nexus-dev-artifactory
      - build_u24:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - build_u22:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - build_u20:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - build_c9:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - build_c8:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - hold_nexus_push:
          type: approval
          requires:
            - build_u24
            - build_u22
            - build_u20
            - build_c9
            - build_c8
      - publish_packages:
          requires:
            - hold_nexus_push
          context:
            - docker-dev-registry
            - nexus-dev-artifactory

  # ------------------------------------------------------------------------
  # REGULAR NON-DEVELOP WORKFLOW (Fast packaging with OCI Upload)
  # ------------------------------------------------------------------------
  non-develop-workflow:
    when: *when_non_develop_workflow
    jobs:
      - generate:
          type: approval
      - checkout:
          requires:
            - generate
          context:
            - docker-dev-registry
            - nexus-dev-artifactory
      - build_u24_non_develop:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - build_u22_non_develop:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - build_u20_non_develop:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - build_c9_non_develop:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - build_c8_non_develop:
          requires:
            - checkout
          context:
            - docker-dev-registry
      - upload_to_s3_hold:
          type: approval
          requires:
            - build_u24_non_develop
            - build_u22_non_develop
            - build_u20_non_develop
            - build_c9_non_develop
            - build_c8_non_develop
      - upload_to_s3:
          context:
            - oracle
            - docker-dev-registry
          requires:
            - upload_to_s3_hold
